services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - SERVER_PORT=8080
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - DATABASE_PATH=/data/lifesim.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET}
      - SITE_ACCESS_CODE=${SITE_ACCESS_CODE}
      - AUTH_BOOTSTRAP_USERS=${AUTH_BOOTSTRAP_USERS}
      - AUTH_ACCESS_TTL=${AUTH_ACCESS_TTL:-2h}
      - AUTH_REFRESH_TTL=${AUTH_REFRESH_TTL:-720h}
      - AUTH_GATE_TTL=${AUTH_GATE_TTL:-24h}
      - AUTH_RATE_LIMIT=${AUTH_RATE_LIMIT:-5}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
    volumes:
      - lifesim-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  lifesim-data:
